; 
; Syntax of this configuration file:
; 
; [key]: setting key
; - Field "description": description, just for information.
; - Field "type": type of setting, e. g. mail, number, foreign_key, etc.
; - Field "default": default value
; - Field "db_field": corresponding database field (table.field)
;

[action]
description = "Text on action button for forms"
scope[] = categories
subtree[] = forms
example[] = "action=Jetzt abstimmen!"

[activities_access_property_prefix]
description = "Set a different property prefix or disable prefix for access properties"
type = bool
scope[] = categories
subtree[] = channels

[activities_contacts_access_hidden]
description = "Hide this group in the contacts/access form"
type = bool
scope[] = usergroups

[activities_download_max_filesize]
description = "Maximum file size of a downloadable archive"
type = bytes
default = 1G

[activities_form_upload_folder]
description = "Path to upload folder for forms (subfolders per event will be created there)"

[activities_formfield_watch_wait_seconds]
description = "Seconds to wait after the content of a field was changed before sending out a form mail"
type = int
default = 300

[activities_formmail_wait_no_address_seconds]
description = "Delay before retrying when no recipient e-mail addresses are available"
type = int
default = 86400

[activities_formfielddata_concat_fields]
description = "If a form field has more than one value (e. g. detail record with several fields), characters to concatenate values"
default = ", "

[activities_formfielddata_concat_rows]
description = "If a form field has more than one line, characters to concatenate lines"
default = ";\n"

[activities_formmail_sender_copy]
description = "Send a copy of each form mail to the sender e-mail address"
type = bool
scope[] = events
scope[] = website

[activities_mail_bcc]
description = "Send registration mails as BCC to these addresses"

[activities_mailings_help]
description = "Link to a help page for placeholders in mailings"
type = path

[activities_mailings_suffix_alternative_from]
description = "If your own e-mail address is not used as From address in mailings, this suffix is appended"

[activities_maxlength_memo]
description = "Maximum length of entry in memo field for forms"
type = int

[activities_registration_usergroup_default]
description = "Identifier of default user group for registration forms"
default = participant

[activities_use_contactverifications]
description = "Use the `contactverifications` table instead of `activities` (deprecated)"
type = bool

[activities_usergroups_organisation]
description = "Allow linking a user group to an organisation contact"
type = bool

[activities_usergroups_show_description]
description = "Show description of user groups in list view"
type = bool
default = 1

[db_field]
description = "Map formfield category to database column (table.field)"
scope[] = categories
subtree[] = field-types
example[] = "db_field=contactdetails.identification"
example[] = "db_field=contacts.contact"
example[] = "db_field=persons.first_name"
example[] = "db_field=persons.last_name"
example[] = "db_field=registrationtexts.registrationtext"
example[] = "db_field=registrationvarchars.registrationvarchar"

[db_foreign_key]
description = "Foreign-key column for multi-row formfield data"
scope[] = categories
subtree[] = field-types
example[] = "db_foreign_key=formfield_id"

[db_joins]
description = "Extra LEFT JOIN clauses for reading formfield data (table.column format)"
scope[] = categories
subtree[] = field-types
list = 1
example[] = "db_joins[0]=filetypes.medium_id"

[db_values]
description = "Preset hidden values on registration insert (category IDs, usergroup, etc.)"
scope[] = categories
list = 1
subtree[] = field-types
subtree[] = forms
example[] = "db_values[contacts.contact_category_id]=ID categories contact/waehler"
example[] = "db_values[contacts.published]=no"
example[] = "db_values[participants.usergroup_id]=ID usergroups teilnehmer"
example[] = "db_values[channel_category_id]=ID categories channel/e-mail"

[enum]
description = "Select options for formkit select fields"
scope[] = categories
subtree[] = field-types
list = 1
example[] = "enum[0]=ja"
example[] = "enum[1]=nein"

[formmail_subject]
description = "Subject line per mail type (authentication, confirmation, field-changed)"
scope[] = categories
subtree[] = forms
list = 1
example[] = "formmail_subject[authentication]=Bitte bestätigen Sie Ihre Stimme"

[hide_in_formfielddata]
description = "Do not show in form field data"
scope[] = formfields
type = bool

[legend]
description = "H2 heading above form"
scope[] = categories
subtree[] = forms
example[] = "legend=Verbindliche Anmeldung zu dieser Veranstaltung"

[legend_insert]
description = "H2 heading above form after insert"
scope[] = categories
subtree[] = forms
example[] = "legend_insert=Danke für die Stimme!"

[main_medium_id]
description = "Media folder ID for file uploads (overrides auto-created event upload folder)"
scope[] = categories
subtree[] = field-types
scope[] = formfields
example[] = "main_medium_id=123"

[newsletter]
description = "Subscribe registrant to newsletter after successful registration"
scope[] = categories
subtree[] = field-types

[newsletter_subscribe_url]
description = "API URL for external newsletter subscription"
scope[] = categories
subtree[] = field-types
example[] = "newsletter_subscribe_url= https://www.example.org/api/public/subscription"

[no_confirmation_mail]
description = "Skip confirmation mail for this registration form"
scope[] = categories
subtree[] = forms

[optional]
description = "Form field or subtable is optional (not required for submission)"
type = bool
scope[] = formfields

[present]
description = "Include usergroup in participant presence lists; set to 0 to exclude"
type = bool
scope[] = usergroups
example[] = "present=0"

[registration]
description = "Enable registrations for events of this category"
type = bool
scope[] = categories
subtree[] = events

[required_fields]
description = "List of required fields per form"
list = 1
scope[] = categories
subtree[] = forms
scope[] = contacts
example[] = "required_fields[0]=name"
example[] = "required_fields[1]=e-mail"
example[] = "required_fields[2]=selection"

[show_without_login]
description = "Always show this field if the form requires login, even if user is not logged in"
type = bool
scope[] = categories
subtree[] = field-types

[select_type]
description = "Property name for select options: enum or selection (default: enum)"
scope[] = categories
subtree[] = field-types
scope[] = formfields
default = enum
example[] = "select_type=selection"

[selection]
description = "Option list for formkit select fields (alternative to enum)"
scope[] = categories
subtree[] = field-types
list = 1
example[] = "selection[0]=ja"
example[] = "selection[1]=nein"

[selection_from_explanation]
description = "Use formfield explanation text as the single select option instead of enum/selection"
type = bool
scope[] = categories
subtree[] = field-types

[sql_query]
description = "Named SQL query key for populating select options"
scope[] = categories
subtree[] = field-types
example[] = "sql_query=custom_clubs_selection"
example[] = "sql_query=custom_federation_selection"

[uid]
description = "Newsletter or mailing-list UUID per select option"
scope[] = categories
subtree[] = field-types
list = 1
example[] = "uid[0]=08d472c3-5f52-41fe-ba86-5a210f095a4a"
example[] = "uid[1]=8ee6d042-6eba-403a-927d-c883313f0ae6"

[usergroup_category]
description = "Use children of this category as categories for user groups"
type = bool
scope[] = categories
subtree[] = events
subtree[] = relations

[title]
description = "Override field title on generated registration form"
scope[] = categories
subtree[] = forms
example[] = "title=Anmeldung"
example[] = "title=Bewerbung"

[zzform]
scope[] = categories
subtree[] = field-types
scope[] = formfields
example[] = "zzform[type]=select"
example[] = "zzform[type]=upload"
example[] = "zzform[maxlength]=500"
example[] = "zzform[max_records]=3"
example[] = "zzform[hide_in_list]=1"
example[] = "zzform[input_filetypes]=pdf"
example[] = "zzform[upload_max_filesize]=5M"
example[] = "zzform[show_values_as_list]=1"
